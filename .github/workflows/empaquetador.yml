name: Actualizar Bundle para IA Automatico

on:
  push:
    branches: [ main ] # Cambia 'main' si usas otra rama principal como 'master'

jobs:
  generar-bundle:
    runs-on: ubuntu-latest
    env:
      REPO_DESTINO: FABIOR1981/bd
      NOMBRE_PROYECTO: ${{ github.event.repository.name }}
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Generar archivo Markdown para IA
        run: |
          python3 - <<'EOF'
          import os

          NOMBRE = os.environ['NOMBRE_PROYECTO']
          # El archivo se genera FUERA del proyecto (carpeta temporal del runner)
          SALIDA = os.path.join(os.environ['RUNNER_TEMP'], f'proyecto-para-ia-{NOMBRE}.md')

          IGNORAR_PATRONES = ['node_modules', '.git', '.github']
          EXTENSIONES_TEXTO = ['.html', '.css', '.js', '.md', '.json', '.webmanifest', '.txt', '.py']

          def es_ignorable(ruta):
              partes = ruta.split(os.sep)
              for parte in partes:
                  if parte in IGNORAR_PATRONES or parte.startswith('.'):
                      return True
              # Ignorar bundles viejos que pudieran quedar en el repo
              if os.path.basename(ruta).startswith('proyecto-para-ia'):
                  return True
              return False

          archivos_encontrados = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not es_ignorable(os.path.relpath(os.path.join(root, d), '.'))]
              for file in files:
                  ruta_relativa = os.path.relpath(os.path.join(root, file), '.')
                  ruta_relativa = ruta_relativa.replace(os.sep, '/')
                  if not es_ignorable(ruta_relativa):
                      archivos_encontrados.append(ruta_relativa)

          archivos_encontrados.sort()

          output = f"# Bundle del Proyecto para IA: {NOMBRE}\n\n"
          output += "## Estructura de Archivos\n"
          for ruta in archivos_encontrados:
              output += f"- {ruta}\n"
          output += "\n---\n\n## Código Fuente\n\n"

          for ruta in archivos_encontrados:
              ext = os.path.splitext(ruta)[1].lower()
              lang = ext.lstrip('.')
              if lang == 'js': lang = 'javascript'

              try:
                  with open(ruta, 'r', encoding='utf-8') as f:
                      contenido = f.read()
              except Exception:
                  contenido = "[Archivo Binario o No Leíble]"

              output += f"### Archivo: `{ruta}`\n"
              output += f"```{lang}\n{contenido}\n```\n\n"

          with open(SALIDA, 'w', encoding='utf-8') as f:
              f.write(output)

          print(f"¡Bundle generado con éxito: {SALIDA}")
          EOF

      - name: 4. Guardar el bundle en el repositorio FABIOR1981/bd
        env:
          BD_TOKEN: ${{ secrets.BD_TOKEN }}
        run: |
          ARCHIVO="proyecto-para-ia-${NOMBRE_PROYECTO}.md"

          git clone "https://x-access-token:${BD_TOKEN}@github.com/${REPO_DESTINO}.git" "$RUNNER_TEMP/bd"
          cd "$RUNNER_TEMP/bd"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DESTINO="respaldos MD/${NOMBRE_PROYECTO}"
          mkdir -p "${DESTINO}"
          cp "$RUNNER_TEMP/${ARCHIVO}" "${DESTINO}/${ARCHIVO}"

          git add "${DESTINO}/${ARCHIVO}"
          if git diff --staged --quiet; then
            echo "Sin cambios en el bundle."
            exit 0
          fi

          git commit -m "chore: actualizar bundle de ${NOMBRE_PROYECTO}"

          # Reintenta por si otro proyecto empujó al mismo repo al mismo tiempo
          for intento in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1