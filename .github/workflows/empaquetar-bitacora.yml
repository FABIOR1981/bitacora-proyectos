name: Actualizar Bundle para IA Automatico

on:
  push:
    branches: [ main ] # Cambia 'main' si usas otra rama principal como 'master'

jobs:
  generar-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Generar archivo Markdown para IA
        run: |
          python3 - <<'EOF'
          import os

          IGNORAR_PATRONES = ['node_modules', '.git', '.github', 'proyecto-para-ia.md']
          EXTENSIONES_TEXTO = ['.html', '.css', '.js', '.md', '.json', '.webmanifest', '.txt', '.py']

          def es_ignorable(ruta):
              partes = ruta.split(os.sep)
              for parte in partes:
                  if parte in IGNORAR_PATRONES or parte.startswith('.'):
                      return True
              return False

          archivos_encontrados = []
          for root, dirs, files in os.walk('.'):
              # Modificamos dirs in-place para omitir carpetas no deseadas
              dirs[:] = [d for d in dirs if not es_ignorable(os.path.join(root, d))]
              for file in files:
                  ruta_relativa = os.path.relpath(os.path.join(root, file), '.')
                  ruta_relativa = ruta_relativa.replace(os.sep, '/')
                  if not es_ignorable(ruta_relativa):
                      archivos_encontrados.append(ruta_relativa)

          archivos_encontrados.sort()

          # Construir el contenido Markdown
          output = "# Bundle del Proyecto para IA\n\n"
          output += "## Estructura de Archivos\n"
          for ruta in archivos_encontrados:
              output += f"- {ruta}\n"
          output += "\n---\n\n## Código Fuente\n\n"

          for ruta in archivos_encontrados:
              ext = os.path.splitext(ruta)[1].lower()
              # Mapear lenguajes para el bloque markdown
              lang = ext.lstrip('.')
              if lang == 'js': lang = 'javascript'
              elif lang == 'html': lang = 'html'
              elif lang == 'css': lang = 'css'
              elif lang == 'json': lang = 'json'

              try:
                  with open(ruta, 'r', encoding='utf-8') as f:
                      contenido = f.read()
              except Exception:
                  contenido = "[Archivo Binario o No Leíble]"

              output += f"### Archivo: `{ruta}`\n"
              output += f"```{lang}\n{contenido}\n```\n\n"

          with open('proyecto-para-ia.md', 'w', encoding='utf-8') as f:
              f.write(output)

          print("¡Bundle generado con éxito!")
          EOF

      - name: 4. Guardar cambios en el repositorio si hubo modificaciones
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add proyecto-para-ia.md
          git diff --staged --quiet || git commit -m "chore: actualizar proyecto-para-ia.md automático [skip ci]"
          git push