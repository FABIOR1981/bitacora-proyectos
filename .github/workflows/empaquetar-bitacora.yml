name: Actualizar Bundle para IA Automatico

on:
  push:
    branches: [ main ] # Cambia 'main' si usas 'master'

permissions:
  contents: write

jobs:
  generar-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Generar archivo Markdown para IA incluyendo subcarpetas
        run: |
          python3 - <<'EOF'
          import os

          # Solo ignoramos carpetas del sistema y el archivo de salida final
          IGNORAR_CARPETAS = {'node_modules', '.git', '.github'}
          IGNORAR_ARCHIVOS = {'proyecto-para-ia.md'}

          archivos_encontrados = []
          for root, dirs, files in os.walk('.'):
              # Filtrar carpetas ignoradas para que no entre en ellas
              dirs[:] = [d for d in dirs if d not in IGNORAR_CARPETAS and not d.startswith('.')]
              
              for file in files:
                  if file in IGNORAR_ARCHIVOS:
                      continue
                  
                  ruta_completa = os.path.join(root, file)
                  ruta_relativa = os.path.relpath(ruta_completa, '.')
                  ruta_relativa = ruta_relativa.replace(os.sep, '/')
                  
                  # Evitar archivos ocultos en la raíz o subniveles
                  if any(p.startswith('.') for p in ruta_relativa.split('/')):
                      continue
                      
                  archivos_encontrados.append(ruta_relativa)

          archivos_encontrados.sort()

          # Construir la estructura en Markdown
          output = "# Bundle del Proyecto para IA\n\n## Estructura de Archivos\n"
          for ruta in archivos_encontrados:
              output += f"- {ruta}\n"
          output += "\n---\n\n## Código Fuente\n\n"

          # Agregar el código fuente de cada archivo
          for ruta in archivos_encontrados:
              ext = os.path.splitext(ruta)[1].lower()
              lang = ext.lstrip('.')
              if lang == 'js': lang = 'javascript'
              elif lang == 'html': lang = 'html'
              elif lang == 'css': lang = 'css'
              elif lang == 'json': lang = 'json'

              try:
                  with open(ruta, 'r', encoding='utf-8') as f:
                      contenido = f.read()
              except Exception:
                  contenido = "[Archivo Binario o No Leíble]"

              output += f"### Archivo: `{ruta}`\n```{lang}\n{contenido}\n```\n\n"

          with open('proyecto-para-ia.md', 'w', encoding='utf-8') as f:
              f.write(output)

          print("¡Bundle generado correctamente con todas las subcarpetas y estilos!")
          EOF

      - name: 4. Guardar cambios en el repositorio si hubo modificaciones
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add proyecto-para-ia.md
          git diff --staged --quiet || git commit -m "chore: actualizar proyecto-para-ia.md con todos los estilos automático [skip ci]"
          git push