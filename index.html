<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora de proyectos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--sf:#fff;--tx:#1b1a17;--mu:#6d6a62;--bd:#e4e0d6;--ac:#1b1a17;
--produccion:#16a34a;--desarrollo:#d97706;--prototipo:#7c3aed;--pausa:#78716c;--idea:#0284c7;
--fh:'Bricolage Grotesque',system-ui,sans-serif;--fm:'Geist Mono',ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root:not([data-tema=claro]){--bg:#121110;--sf:#1b1a18;--tx:#f1eee6;--mu:#9a968b;--bd:#2c2a26;--ac:#f1eee6}}
:root[data-tema=oscuro]{--bg:#121110;--sf:#1b1a18;--tx:#f1eee6;--mu:#9a968b;--bd:#2c2a26;--ac:#f1eee6}
*{box-sizing:border-box;margin:0}
html{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
body{background:var(--bg);color:var(--tx);font-family:var(--fh);min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:56px 24px 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(2.4rem,7vw,4.5rem);font-weight:800;letter-spacing:-.04em;line-height:.95}
.sub{color:var(--mu);font-family:var(--fm);font-size:.85rem;margin-top:14px}
.btn,.chip{background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:8px 14px;font:500 .8rem var(--fm);cursor:pointer}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.btn.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.btn.prim{background:var(--ac);color:var(--bg)}
.barra{display:flex;gap:10px;flex-wrap:wrap;margin:40px 0 28px;align-items:center}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:11px 14px;font:400 .95rem var(--fh);width:100%}
#buscar{flex:1;min-width:200px;width:auto}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{background:transparent;color:var(--mu)}
.chip[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.chip b{font-weight:500;opacity:.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;transition:transform .2s,border-color .2s;animation:ent .4s both}
.card:hover{transform:translateY(-3px);border-color:var(--c)}
@keyframes ent{from{opacity:0;transform:translateY(8px)}}
.fase{display:inline-flex;align-items:center;gap:8px;font:500 .72rem var(--fm);color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.fase i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
h2{font-size:1.3rem;font-weight:700;letter-spacing:-.02em;word-break:break-word}
.desc{color:var(--mu);font-size:.92rem;line-height:1.45;flex:1}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a,.links span,.links button{font:500 .75rem var(--fm);padding:7px 12px;border-radius:8px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;background:none;cursor:pointer}
.links a:hover,.links button:hover{background:var(--ac);color:var(--bg)}
.links span{color:var(--mu);border-style:dashed;cursor:default}
.links .del:hover{background:#dc2626;border-color:#dc2626;color:#fff}
.vacio{color:var(--mu);font-family:var(--fm);padding:40px 0}
dialog{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:26px;width:min(440px,92vw);margin:auto}
dialog::backdrop{background:#0009}
dialog form{display:grid;gap:12px}
dialog label{font:500 .75rem var(--fm);color:var(--mu);display:grid;gap:6px}
dialog h3{font-size:1.4rem;letter-spacing:-.02em}
.fila{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.aviso{font:400 .78rem var(--fm);color:#dc2626;min-height:1em}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);padding:10px 18px;border-radius:99px;font:500 .8rem var(--fm);opacity:0;pointer-events:none;transition:opacity .3s}
#toast.v{opacity:1}
@media(prefers-reduced-motion:reduce){.card{animation:none;transition:none}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Bitácora<br>de proyectos</h1><p class="sub" id="resumen">Cargando…</p></div>
  <div class="acc">
    <button class="btn" id="nuevo" hidden>+ Nuevo</button>
    <button class="btn" id="token" hidden>🔑 Token</button>
    <button class="btn" id="llave" aria-pressed="false">🔒 Admin</button>
    <button class="btn" id="tema">◐</button>
  </div>
</header>
<div class="barra">
  <input id="buscar" type="search" placeholder="Buscar proyecto…" aria-label="Buscar proyecto">
  <div id="filtros" style="display:contents"></div>
</div>
<section class="grid" id="lista" aria-live="polite"></section>
</main>

<dialog id="dClave"><form method="dialog" id="fClave"><h3>Modo admin</h3>
  <label>Contraseña<input type="password" id="pw" autocomplete="current-password" required></label>
  <p class="aviso" id="avClave"></p>
  <div class="fila"><button type="button" class="btn" data-cerrar>Cancelar</button><button class="btn prim">Entrar</button></div></form></dialog>

<dialog id="dEd"><form method="dialog" id="fEd"><h3 id="tEd">Proyecto</h3>
  <label>Nombre<input id="eNombre" required></label>
  <label>Descripción<textarea id="eDesc" rows="2"></textarea></label>
  <label>Repositorio (GitHub)<input id="eRepo" placeholder="https://github.com/FABIOR1981/…"></label>
  <label>URL del sitio<input id="eUrl" placeholder="https://…"></label>
  <label>Fase<select id="eFase"></select></label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ePriv" style="width:auto"> Repositorio privado</label>
  <p class="aviso" id="avEd"></p>
  <div class="fila"><button type="button" class="btn" data-cerrar>Cancelar</button><button class="btn prim" id="gEd">Guardar</button></div></form></dialog>
<div id="toast"></div>

<script>
/* ===== CONFIGURACIÓN ===== */
const REPO='FABIOR1981/bd', RUTA='bitacora/proyectos.json', RAMA='main';
const FASES={produccion:'En producción',desarrollo:'En desarrollo',prototipo:'Prototipo',pausa:'En pausa',idea:'Idea'};
/* ========================== */
const API=`https://api.github.com/repos/${REPO}/contents/${RUTA}`;
let datos=[],verificador='',faseActiva='todas',admin=false,clave='',editId=null;
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seguro=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const getTok=()=>{try{return localStorage.getItem('bitacora_token')||''}catch{return ''}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('v');setTimeout(()=>t.classList.remove('v'),2400)};

/* --- cifrado (AES-GCM + PBKDF2) --- */
const enc=new TextEncoder(),dec=new TextDecoder();
async function derivar(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function cifrar(t,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await derivar(pw,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(t)));const a=new Uint8Array(28+ct.length);a.set(salt);a.set(iv,16);a.set(ct,28);return btoa(String.fromCharCode(...a))}
async function descifrar(b,pw){const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const k=await derivar(pw,a.slice(0,16));return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(16,28)},k,a.slice(28)))}

/* --- GitHub --- */
const cab=(extra={})=>{const t=getTok();return{Accept:'application/vnd.github+json',...(t?{Authorization:'Bearer '+t}:{}),...extra}};
async function cargar(){
  const r=await fetch(API+'?ref='+RAMA,{headers:cab({Accept:'application/vnd.github.raw+json'}),cache:'no-store'});
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();verificador=j.verificador||'';datos=j.proyectos||[];
}
async function guardar(){
  const meta=await fetch(API+'?ref='+RAMA,{headers:cab(),cache:'no-store'});
  if(!meta.ok)throw new Error('No se pudo leer (GitHub '+meta.status+')');
  const sha=(await meta.json()).sha;
  const limpio=await Promise.all(datos.map(async p=>{const {repo,...o}=p;o.repoCifrado=repo?await cifrar(repo,clave):'';return o}));
  const cuerpo=JSON.stringify({verificador,proyectos:limpio},null,2);
  const bytes=enc.encode(cuerpo);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
  const r=await fetch(API,{method:'PUT',headers:cab({'Content-Type':'application/json'}),body:JSON.stringify({message:'bitacora: actualizar proyectos',content:btoa(bin),sha,branch:RAMA})});
  if(!r.ok)throw new Error(r.status===401||r.status===403||r.status===404?'Token inválido o sin permiso de escritura':'Error GitHub '+r.status);
}

/* --- vista --- */
function filtros(){
  const n=f=>f==='todas'?datos.length:datos.filter(p=>p.fase===f).length;
  $('#filtros').innerHTML=['todas',...Object.keys(FASES)].filter(f=>f==='todas'||n(f)).map(f=>`<button class="chip" data-f="${f}" aria-pressed="${f===faseActiva}">${f==='todas'?'Todas':FASES[f]} <b>${n(f)}</b></button>`).join('');
}
function pintar(){
  const q=$('#buscar').value.trim().toLowerCase();
  const v=datos.filter(p=>(faseActiva==='todas'||p.fase===faseActiva)&&(p.nombre+' '+(p.descripcion||'')).toLowerCase().includes(q));
  $('#lista').innerHTML=v.length?v.map((p,i)=>{
    const r=admin?seguro(p.repo):'',u=seguro(p.url);
    return `<article class="card" style="--c:var(--${esc(p.fase)},var(--mu));animation-delay:${i*30}ms">
      <span class="fase"><i></i>${esc(FASES[p.fase]||p.fase)}${p.privado&&admin?' · 🔒 privado':''}</span>
      <h2>${esc(p.nombre)}</h2><p class="desc">${esc(p.descripcion)}</p>
      <div class="links">${u?`<a href="${u}" target="_blank" rel="noopener">↗ Sitio</a>`:'<span>sin URL</span>'}${admin?(r?`<a href="${r}" target="_blank" rel="noopener">⌥ Repo</a>`:'<span>sin repo</span>'):''}
      ${admin?`<button data-ed="${esc(p.id)}">Editar</button><button class="del" data-del="${esc(p.id)}">Borrar</button>`:''}</div>
    </article>`}).join(''):'<p class="vacio">Sin resultados.</p>';
  const prod=datos.filter(p=>p.fase==='produccion').length;
  $('#resumen').textContent=`${datos.length} proyectos · ${prod} en producción${admin?' · modo admin':''}`;
}
function modo(){
  $('#nuevo').hidden=$('#token').hidden=!admin;
  const l=$('#llave');l.textContent=admin?'🔓 Salir':'🔒 Admin';l.classList.toggle('on',admin);
  filtros();pintar();
}

/* --- eventos --- */
$('#filtros').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;faseActiva=b.dataset.f;filtros();pintar()};
$('#buscar').oninput=pintar;
$('#tema').onclick=()=>{const r=document.documentElement,o=matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.tema=(r.dataset.tema||(o?'oscuro':'claro'))==='oscuro'?'claro':'oscuro'};
document.querySelectorAll('[data-cerrar]').forEach(b=>b.onclick=()=>b.closest('dialog').close());

$('#llave').onclick=()=>{
  if(admin){admin=false;clave='';datos.forEach(p=>delete p.repo);modo();return}
  $('#pw').value='';$('#avClave').textContent='';$('#dClave').showModal();$('#pw').focus();
};
$('#fClave').onsubmit=async e=>{
  e.preventDefault();const pw=$('#pw').value.trim();
  if(!verificador){$('#avClave').textContent='El JSON cargado no es el nuevo (falta "verificador"). Subí bitacora/proyectos.json a bd y recargá con Ctrl+F5.';return}
  $('#avClave').textContent='Verificando…';
  try{
    await descifrar(verificador,pw);
    clave=pw;
    await Promise.all(datos.map(async p=>{p.repo=p.repoCifrado?await descifrar(p.repoCifrado,pw):''}));
    admin=true;$('#dClave').close();modo();
    if(!getTok())toast('Falta el token de GitHub para guardar (botón 🔑)');
  }catch{$('#avClave').textContent='Contraseña incorrecta.'}
};
$('#token').onclick=()=>{
  const t=prompt('Token de GitHub (fine-grained, permiso Contents: Read and write sobre el repo bd).\nSe guarda solo en este navegador. Vacío = borrar.',getTok());
  if(t===null)return;try{t?localStorage.setItem('bitacora_token',t.trim()):localStorage.removeItem('bitacora_token')}catch{}
  toast(t?'Token guardado':'Token borrado');if(!datos.length)cargar().then(modo).catch(()=>{});
};
$('#eFase').innerHTML=Object.entries(FASES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
function abrirEd(id){
  editId=id;const p=datos.find(x=>x.id===id)||{fase:'desarrollo'};
  $('#tEd').textContent=id?'Editar proyecto':'Nuevo proyecto';
  $('#eNombre').value=p.nombre||'';$('#eDesc').value=p.descripcion||'';$('#eRepo').value=p.repo||'';
  $('#eUrl').value=p.url||'';$('#eFase').value=p.fase;$('#ePriv').checked=!!p.privado;$('#avEd').textContent='';
  $('#dEd').showModal();
}
$('#nuevo').onclick=()=>abrirEd(null);
$('#lista').onclick=async e=>{
  const ed=e.target.closest('[data-ed]'),del=e.target.closest('[data-del]');
  if(ed)return abrirEd(ed.dataset.ed);
  if(del&&confirm('¿Borrar este proyecto?')){
    const copia=[...datos];datos=datos.filter(p=>p.id!==del.dataset.del);
    try{await guardar();toast('Borrado');modo()}catch(er){datos=copia;toast(er.message)}
  }
};
$('#fEd').onsubmit=async e=>{
  e.preventDefault();const g=$('#gEd');g.disabled=true;$('#avEd').textContent='Guardando…';
  const nuevo={id:editId||crypto.randomUUID().slice(0,8),nombre:$('#eNombre').value.trim(),descripcion:$('#eDesc').value.trim(),
    repo:$('#eRepo').value.trim(),url:$('#eUrl').value.trim(),fase:$('#eFase').value,privado:$('#ePriv').checked};
  const copia=[...datos];
  datos=editId?datos.map(p=>p.id===editId?nuevo:p):[nuevo,...datos];
  try{await guardar();$('#dEd').close();toast('Guardado en GitHub');modo()}
  catch(er){datos=copia;$('#avEd').textContent=er.message}
  g.disabled=false;
};

cargar().then(modo).catch(()=>{$('#token').hidden=false;$('#resumen').textContent='No se pudo leer el JSON de GitHub. Si el repo bd es privado, entrá a Admin y cargá el token.'});
</script>
</body>
</html>
